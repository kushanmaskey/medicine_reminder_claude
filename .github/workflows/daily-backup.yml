name: Daily Prod Backup

on:
  schedule:
    # Runs every day at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Also triggerable manually from the GitHub Actions UI

jobs:
  backup:
    name: Export prod data → backup repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run backup script
        env:
          PROD_SERVICE_ROLE_KEY: ${{ secrets.PROD_SERVICE_ROLE_KEY }}
        run: python3 backup_prod.py --output-dir /tmp/backups

      - name: Check for data loss vs previous backup
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_GITHUB_REPO: ${{ secrets.BACKUP_GITHUB_REPO }}
        run: |
          python3 - <<'PYEOF'
          import os, json, subprocess, sys, glob

          # Clone backup repo to read yesterday's manifest
          token = os.environ["BACKUP_REPO_TOKEN"]
          repo  = os.environ["BACKUP_GITHUB_REPO"]
          subprocess.run(
            ["git", "clone", "--depth=1",
             f"https://x-access-token:{token}@github.com/{repo}.git",
             "/tmp/backup-repo"],
            check=True, capture_output=True
          )

          # Find the most recent existing manifest in the backup repo
          zips = sorted(glob.glob("/tmp/backup-repo/backups/*.zip"), reverse=True)
          prev_counts = {}
          if zips:
            import zipfile
            with zipfile.ZipFile(zips[0]) as zf:
              names = zf.namelist()
              manifest_name = next((n for n in names if n.endswith("manifest.json")), None)
              if manifest_name:
                prev_counts = json.loads(zf.read(manifest_name)).get("tables", {})

          # Read today's manifest
          today_dirs = sorted(glob.glob("/tmp/backups/*/manifest.json"), reverse=True)
          if not today_dirs:
            print("No today manifest found — skipping check")
            sys.exit(0)
          today_counts = json.load(open(today_dirs[0])).get("tables", {})

          # Compare — fail if any important table drops more than 20%
          WATCHED = ["activities", "vitals", "prescriptions", "appointments", "allergies", "insurance"]
          problems = []
          for table in WATCHED:
            prev = prev_counts.get(table, 0)
            today = today_counts.get(table, 0)
            if prev > 0 and today < prev * 0.8:
              drop = prev - today
              pct  = round((drop / prev) * 100)
              problems.append(f"  {table}: {prev} → {today} (dropped {drop} rows / {pct}%)")

          if problems:
            print("DATA LOSS DETECTED — backup halted, investigate before proceeding:")
            for p in problems:
              print(p)
            sys.exit(1)
          else:
            print("Row count check passed:")
            for table in WATCHED:
              p = prev_counts.get(table, "N/A")
              t = today_counts.get(table, 0)
              print(f"  {table}: {p} → {t}")
          PYEOF

      - name: Push backup to private backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_GITHUB_REPO: ${{ secrets.BACKUP_GITHUB_REPO }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          cd /tmp/backups
          zip -r ${TODAY}.zip ${TODAY}/

          cd /tmp/backup-repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          mkdir -p backups
          cp /tmp/backups/${TODAY}.zip backups/

          git add backups/
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "backup: ${TODAY}"
          git push
